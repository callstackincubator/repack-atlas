# Single-package project. The root is listed explicitly (".") because the
# changesets tooling resolves release targets through the workspace and refuses
# a changeset for a package it does not find there; `fixtures/*` are listed so
# they can be installed and tested together with the tool.
packages:
  - "."
  - "fixtures/*"

# tsx needs the esbuild native binary (pnpm >= 11 blocks build scripts by default).
allowBuilds:
  esbuild: true

# @callstack/repack is a peerDependency resolved from the *user project*
# (PRD 6.2 rule 2), never from Atlas's own tree, so pnpm must not
# auto-install it into node_modules as if it were a real dependency.
autoInstallPeers: false
